{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  {% if user.must_change_pw %}<p class="flash info">Choose a new password before continuing.</p>{% endif %}
  <form method="post" action="/account/password" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password (10+ characters) <input name="new" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Confirm new password <input name="confirm" type="password" autocomplete="new-password" minlength="10" required></label>
    <button class="primary">Save</button>
  </form>
</section>
{% endblock %}
