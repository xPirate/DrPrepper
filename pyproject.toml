[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drprepper"
version = "0.1.0"
description = "Offline medication & overdose reference (touchscreen) with a field EHR web console"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
ingest = ["ijson>=3.2", "requests>=2.31"]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "sqlcipher3-wheels>=0.5",
  "cryptography>=42",
]
touch = ["kivy>=2.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
drprepper-ingest = "drprepper.ingest.__main__:main"
drprepper-manage = "drprepper.server.manage:main"
drprepper-touch = "drprepper.touch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drprepper = [
  "data/*.yaml",
  "data/fixtures/*.json",
  "server/templates/*.html",
  "server/static/*",
  "server/static/icons/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
